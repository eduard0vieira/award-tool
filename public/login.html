<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <title>Entrar · Bot de Emissões V2</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#eff1f0" />
  <script>
    // Before the stylesheet paints, so a dark choice never flashes light first.
    try {
      const saved = localStorage.getItem("awardtool.theme");
      document.documentElement.dataset.theme = saved || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    } catch {
      document.documentElement.dataset.theme = "light";
    }
    if (document.documentElement.dataset.theme === "dark") {
      document.querySelector('meta[name="theme-color"]').content = "#13171b";
    }
  </script>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body class="login-page">
  <main>
    <h1><img class="brand-mark" src="/favicon.svg" alt="" width="28" height="28" /> Bot de Emissões <span class="version">V2</span></h1>

    <form id="login-form" class="login-form" novalidate>
      <h2>Entrar</h2>
      <div class="field">
        <label for="login-user">Usuário</label>
        <input id="login-user" name="user" autocomplete="username" autocapitalize="none" spellcheck="false" aria-required="true" autofocus />
        <div class="reveal" data-error-for="login-user">
          <div><p class="field-error" id="login-user-error">Informe o usuário.</p></div>
        </div>
      </div>
      <div class="field">
        <label for="login-pass">Senha</label>
        <input id="login-pass" name="pass" type="password" autocomplete="current-password" aria-required="true" />
        <div class="reveal" data-error-for="login-pass">
          <div><p class="field-error" id="login-pass-error">Informe a senha.</p></div>
        </div>
      </div>
      <div class="login-actions">
        <div class="reveal" id="login-error-reveal">
          <div><p id="login-error" class="login-error" role="alert"></p></div>
        </div>
        <button type="submit">Entrar</button>
      </div>
    </form>
  </main>
  <script src="/login.js"></script>
</body>
</html>
