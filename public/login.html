<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <title>Entrar · Bot de Emissões</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body class="login-page">
  <main>
    <h1><svg class="brand-mark" viewBox="0 0 64 64" width="28" height="28" aria-hidden="true" focusable="false"><rect width="64" height="64" rx="14" fill="#e11d2f"/><path fill="#fff" d="M52.6 27.4 37.8 25l-8.4-14.6a2.6 2.6 0 0 0-2.3-1.3h-3.3c-.9 0-1.5.8-1.3 1.7l4 14.2-9.5-1.5-2.9-4.6a1.6 1.6 0 0 0-1.4-.8h-2.3c-.9 0-1.5.8-1.3 1.6l1.9 7.9-1.9 7.9c-.2.8.4 1.6 1.3 1.6h2.3c.6 0 1.1-.3 1.4-.8l2.9-4.6 9.5-1.5-4 14.2c-.2.9.4 1.7 1.3 1.7h3.3c1 0 1.8-.5 2.3-1.3L37.8 39l14.8-2.4c2.2-.4 3.8-2.3 3.8-4.6s-1.6-4.2-3.8-4.6z"/></svg> Bot de Emissões <span class="version">v1</span></h1>

    <form id="login-form" class="login-form" novalidate>
      <h2>Entrar</h2>
      <div class="field">
        <label for="login-user">Usuário</label>
        <input id="login-user" name="user" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus />
      </div>
      <div class="field">
        <label for="login-pass">Senha</label>
        <input id="login-pass" name="pass" type="password" autocomplete="current-password" required />
      </div>
      <p id="login-error" class="login-error" role="alert" hidden></p>
      <button type="submit">Entrar</button>
    </form>
  </main>
  <script src="/login.js"></script>
</body>
</html>
