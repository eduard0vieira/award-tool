<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <title>Bot de Emissões</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main>
    <h1>✈️ Bot de Emissões</h1>

    <nav class="abas">
      <button type="button" class="aba-btn ativo" data-aba="tap">AwardTool</button>
      <button type="button" class="aba-btn" data-aba="seatspy">SeatSpy</button>
      <button type="button" class="aba-btn" data-aba="aa">American</button>
      <button type="button" class="aba-btn" data-aba="historico">Histórico</button>
    </nav>

    <!-- Aba própria pro AwardTool (TAP): forma e fila de buscas independentes
         da aba SeatSpy, pra rodar buscas simultâneas nos dois sites sem que
         trocar de aba derrube o progresso da outra (só troca hidden). -->
    <section id="painel-tap" class="painel">
      <form id="form-busca-tap">
        <div class="campo">
          <label for="tap-origem">Origem</label>
          <input id="tap-origem" placeholder="GRU" maxlength="3" required autocomplete="off" />
        </div>
        <div class="campo">
          <label for="tap-destino">Destino</label>
          <input id="tap-destino" placeholder="LIS" maxlength="3" required autocomplete="off" />
        </div>
        <label class="checkbox">
          <input type="checkbox" id="tap-ida-volta" checked />
          Ida e volta
        </label>
        <button type="submit">Buscar</button>

        <!-- Teto de milhas por cabine, em K. Vazio = tabela padrão da TAP
             (181K executiva / 53K econômica); preencha pra explorar outras
             faixas de valor. -->
        <div class="linha-tetos">
          <div class="campo">
            <label for="tap-teto-executiva">Teto Executiva (K)</label>
            <input id="tap-teto-executiva" type="number" min="1" step="0.5" placeholder="padrão: 181" autocomplete="off" />
          </div>
          <div class="campo">
            <label for="tap-teto-economica">Teto Econômica (K)</label>
            <input id="tap-teto-economica" type="number" min="1" step="0.5" placeholder="padrão: 53" autocomplete="off" />
          </div>
        </div>
      </form>

      <p id="tap-aviso" class="aviso" hidden></p>

      <!-- Cada busca vira um card independente aqui dentro (ver tpl-job), então
           várias podem rodar em paralelo (modo agents) sem uma travar a outra. -->
      <div id="tap-fila-buscas" class="fila-buscas"></div>
    </section>

    <!-- Aba própria pro SeatSpy: cobre todos os programas que ele rastreia
         (Air France, JetBlue, British, Cathay, Etihad, Iberia, KLM, Qantas,
         Virgin Atlantic), com teto de milhas por cabine. -->
    <section id="painel-seatspy" class="painel" hidden>
      <form id="form-busca-seatspy">
        <div class="campo">
          <label for="seatspy-programa">Programa</label>
          <select id="seatspy-programa">
            <option value="AF">Air France</option>
            <option value="B6">JetBlue</option>
            <option value="BA">British Airways</option>
            <option value="CX">Cathay Pacific</option>
            <option value="EY">Etihad Airways</option>
            <option value="IB">Iberia</option>
            <option value="KLM">KLM</option>
            <option value="QF">Qantas Airways</option>
            <option value="VIR">Virgin Atlantic</option>
          </select>
        </div>
        <div class="campo">
          <label for="seatspy-origem">Origem</label>
          <input id="seatspy-origem" placeholder="GRU" maxlength="3" required autocomplete="off" />
        </div>
        <div class="campo">
          <label for="seatspy-destino">Destino</label>
          <input id="seatspy-destino" placeholder="MAD" maxlength="3" required autocomplete="off" />
        </div>
        <label class="checkbox">
          <input type="checkbox" id="seatspy-ida-volta" checked />
          Ida e volta
        </label>
        <button type="submit">Buscar</button>

        <!-- Teto de milhas por cabine, em K. Dias mais caros que o teto ficam
             fora do relatório. Vazio = sem filtro. -->
        <div class="linha-tetos">
          <div class="campo">
            <label for="seatspy-teto-economica">Teto Econômica (K)</label>
            <input id="seatspy-teto-economica" type="number" min="1" step="0.25" placeholder="ex.: 25" autocomplete="off" />
          </div>
          <div class="campo">
            <label for="seatspy-teto-premium">Teto Premium (K)</label>
            <input id="seatspy-teto-premium" type="number" min="1" step="0.25" placeholder="ex.: 51" autocomplete="off" />
          </div>
          <div class="campo">
            <label for="seatspy-teto-executiva">Teto Executiva (K)</label>
            <input id="seatspy-teto-executiva" type="number" min="1" step="0.25" placeholder="ex.: 74" autocomplete="off" />
          </div>
          <div class="campo">
            <label for="seatspy-teto-primeira">Teto Primeira (K)</label>
            <input id="seatspy-teto-primeira" type="number" min="1" step="0.25" placeholder="ex.: 120" autocomplete="off" />
          </div>
        </div>
      </form>

      <p id="seatspy-aviso" class="aviso" hidden></p>

      <div id="seatspy-fila-buscas" class="fila-buscas"></div>
    </section>

    <!-- Aba da American Airlines (aa.com, busca de prêmios sem login).
         Uma cabine por busca; filtro de conexões igual ao do site. -->
    <section id="painel-aa" class="painel" hidden>
      <form id="form-busca-aa">
        <div class="campo">
          <label for="aa-origem">Origem</label>
          <input id="aa-origem" placeholder="GRU" maxlength="3" required autocomplete="off" />
        </div>
        <div class="campo">
          <label for="aa-destino">Destino</label>
          <input id="aa-destino" placeholder="MIA" maxlength="3" required autocomplete="off" />
        </div>
        <div class="campo">
          <label for="aa-cabine">Cabine</label>
          <select id="aa-cabine">
            <option value="economica">Econômica</option>
            <option value="premium">Premium Economy</option>
            <option value="executiva">Executiva</option>
            <option value="primeira">Primeira Classe</option>
          </select>
        </div>
        <div class="campo">
          <label for="aa-conexoes">Conexões</label>
          <select id="aa-conexoes">
            <option value="">Todos os voos</option>
            <option value="0">Só voo direto</option>
            <option value="1">Até 1 conexão</option>
          </select>
        </div>
        <div class="campo">
          <label for="aa-teto">Teto de milhas (K)</label>
          <input id="aa-teto" type="number" min="1" step="0.5" placeholder="ex.: 110" autocomplete="off" />
        </div>
        <label class="checkbox">
          <input type="checkbox" id="aa-ida-volta" checked />
          Ida e volta
        </label>
        <button type="submit">Buscar</button>
      </form>

      <p id="aa-aviso" class="aviso" hidden></p>

      <div id="aa-fila-buscas" class="fila-buscas"></div>
    </section>

    <section id="painel-historico" class="painel" hidden>
      <div id="historico-topo" class="historico-topo" hidden>
        <p id="historico-resumo" class="historico-resumo"></p>
        <button type="button" id="btn-limpar-historico" class="btn-limpar">Limpar histórico</button>
      </div>
      <p id="historico-vazio" class="historico-vazio" hidden>Nenhum trecho pesquisado ainda. As buscas feitas na aba Buscar aparecem aqui.</p>
      <div id="lista-historico" class="lista-historico"></div>
    </section>
  </main>

  <template id="tpl-job">
    <section class="job-busca">
      <div class="job-cabecalho">
        <div class="job-info">
          <span class="job-rota"></span>
          <span class="job-status status-fila">Na fila</span>
        </div>
        <div class="progresso">
          <div class="progresso-linha">
            <span class="progresso-label">Buscando...</span>
            <span class="progresso-janela"></span>
          </div>
          <div class="barra">
            <div class="barra-preenchida"></div>
          </div>
        </div>

        <!-- Aparecem só quando a busca termina (ver atualizarAcoesCard). -->
        <div class="job-acoes" hidden>
          <button type="button" class="btn-acao btn-copiar-ida" hidden>Copiar ida</button>
          <button type="button" class="btn-acao btn-copiar-volta" hidden>Copiar volta</button>
          <button type="button" class="btn-acao btn-minimizar">Minimizar</button>
        </div>
      </div>

      <p class="aviso" hidden></p>
      <p class="job-tetos" hidden></p>

      <nav class="sub-abas" hidden>
        <button type="button" class="sub-aba-btn ativo" data-subaba="datas">Datas</button>
        <button type="button" class="sub-aba-btn" data-subaba="upgrade">Upgrade</button>
      </nav>

      <section class="resultado" hidden></section>

      <section class="subpainel-upgrade" hidden>
        <p class="upgrade-explicacao">
          Dias em que Econômica e Executiva têm disponibilidade juntas — nesses dias dá pra
          emitir a passagem em Econômica e usar o upgrade da TAP pra ficar mais barato do que
          emitir direto em Executiva.
        </p>
        <p class="upgrade-vazio historico-vazio" hidden>Nenhum dia com as duas cabines disponíveis nesse período.</p>
        <div class="lista-upgrade"></div>
      </section>
    </section>
  </template>

  <template id="tpl-perna">
    <div class="perna">
      <h2 class="perna-titulo"></h2>
      <div class="colunas">
        <details class="coluna coluna-executiva" open>
          <summary class="coluna-cabecalho">
            <span class="chevron" aria-hidden="true">›</span>
            <h3>Executiva</h3>
            <button type="button" class="btn-copiar">Copiar</button>
          </summary>
          <p class="coluna-resumo"></p>
          <div class="cartoes"></div>
        </details>
        <details class="coluna coluna-economica" open>
          <summary class="coluna-cabecalho">
            <span class="chevron" aria-hidden="true">›</span>
            <h3>Econômica</h3>
            <button type="button" class="btn-copiar">Copiar</button>
          </summary>
          <p class="coluna-resumo"></p>
          <div class="cartoes"></div>
        </details>
      </div>
    </div>
  </template>

  <script src="/app.js"></script>
</body>
</html>
