<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <title>Bot de Emissões TAP</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main>
    <h1>✈️ Emissões TAP</h1>

    <nav class="abas">
      <button type="button" class="aba-btn ativo" data-aba="buscar">Buscar</button>
      <button type="button" class="aba-btn" data-aba="historico">Histórico</button>
    </nav>

    <section id="painel-buscar" class="painel">
      <form id="form-busca">
        <div class="campo">
          <label for="programa">Programa</label>
          <select id="programa" name="programa">
            <option value="tap">TAP</option>
            <option value="IB">Iberia</option>
            <option value="BA">British Airways</option>
          </select>
        </div>
        <div class="campo">
          <label for="origem">Origem</label>
          <input id="origem" name="origem" placeholder="GRU" maxlength="3" required autocomplete="off" />
        </div>
        <div class="campo">
          <label for="destino">Destino</label>
          <input id="destino" name="destino" placeholder="LIS" maxlength="3" required autocomplete="off" />
        </div>
        <!--
          Removido: a busca já traz executiva e econômica juntas na mesma
          pesquisa (ver comentário em server.ts), então escolher cabine aqui
          não muda nada no resultado.
        <div class="campo">
          <label for="cabine">Cabine</label>
          <select id="cabine" name="cabine">
            <option value="1">Executiva</option>
            <option value="2">Econômica</option>
          </select>
        </div>
        -->
        <label class="checkbox">
          <input type="checkbox" id="ida-volta" checked />
          Ida e volta
        </label>
        <button type="submit" id="btn-buscar">Buscar</button>

        <!-- Só para Iberia/British (SeatSpy): teto de milhas por cabine, em K.
             Dias mais caros que o teto ficam fora do relatório. Vazio = sem filtro. -->
        <div id="linha-tetos" class="linha-tetos" hidden>
          <div class="campo">
            <label for="teto-economica">Teto Econômica (K)</label>
            <input id="teto-economica" type="number" min="1" step="0.25" placeholder="ex.: 25" autocomplete="off" />
          </div>
          <div class="campo">
            <label for="teto-premium">Teto Premium (K)</label>
            <input id="teto-premium" type="number" min="1" step="0.25" placeholder="ex.: 51" autocomplete="off" />
          </div>
          <div class="campo">
            <label for="teto-executiva">Teto Executiva (K)</label>
            <input id="teto-executiva" type="number" min="1" step="0.25" placeholder="ex.: 74" autocomplete="off" />
          </div>
        </div>
      </form>

      <p id="aviso" class="aviso" hidden></p>

      <section id="progresso" hidden>
        <div class="progresso-linha">
          <span id="progresso-label">Buscando...</span>
          <span id="progresso-janela"></span>
        </div>
        <div class="barra">
          <div class="barra-preenchida" id="barra-preenchida"></div>
        </div>
      </section>

      <section id="resultado" hidden></section>
    </section>

    <section id="painel-historico" class="painel" hidden>
      <div id="historico-topo" class="historico-topo" hidden>
        <p id="historico-resumo" class="historico-resumo"></p>
        <button type="button" id="btn-limpar-historico" class="btn-limpar">Limpar histórico</button>
      </div>
      <p id="historico-vazio" class="historico-vazio" hidden>Nenhum trecho pesquisado ainda. As buscas feitas na aba Buscar aparecem aqui.</p>
      <div id="lista-historico" class="lista-historico"></div>
    </section>
  </main>

  <template id="tpl-perna">
    <div class="perna">
      <h2 class="perna-titulo"></h2>
      <div class="colunas">
        <div class="coluna coluna-executiva">
          <div class="coluna-cabecalho">
            <h3>Executiva</h3>
            <button type="button" class="btn-copiar">Copiar</button>
          </div>
          <p class="coluna-resumo"></p>
          <div class="cartoes"></div>
        </div>
        <div class="coluna coluna-economica">
          <div class="coluna-cabecalho">
            <h3>Econômica</h3>
            <button type="button" class="btn-copiar">Copiar</button>
          </div>
          <p class="coluna-resumo"></p>
          <div class="cartoes"></div>
        </div>
      </div>
    </div>
  </template>

  <script src="/app.js"></script>
</body>
</html>
